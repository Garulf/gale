tick_interval_ms = 1000
active_profile = "default"

[api]
bind = "127.0.0.1:5250"

[hardware.corsair]
on_release = "keep_last"

[profiles.default.sensors.cpu_hot]
type = "max"
inputs = ["hwmon/nct6798/temp1", "nvidia/0/temp"]

[profiles.default.sensors.room]
type = "webhook"
token = "replace-me-with-the-output-of-openssl-rand-hex-32"
timeout_s = 120.0

[profiles.default.curves.cpu]
type = "point"
sensor = "hwmon/nct6798/temp1"
points = [[30.0, 20.0], [70.0, 100.0]]

[profiles.default.curves.case]
type = "point"
sensor = "virtual/cpu_hot"
points = [[35.0, 25.0], [75.0, 100.0]]

[profiles.default.assignments]

# Saved curve shapes. Load them onto any curve node from the graph editor.
# [presets.silent_case]
# type = "point"
# points = [[30.0, 20.0], [60.0, 40.0], [80.0, 100.0]]

# Display names for hardware channels, keyed by sensor or control id.
# [labels]
# "hwmon/nct6798/temp1" = "CPU die"
# "corsair/commander-pro-0805/fan1" = "Front intake"

# Home Assistant over MQTT discovery. The password is kept out of GET /api/config.
# [mqtt]
# enabled = true
# host = "homeassistant.local"
# port = 1883
# username = "gale"
# password = "replace-me"
