[package]
name = "gale-tray"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "gale-tray"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.24"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
ureq = { version = "3", default-features = false }

[build-dependencies]
winresource = "0.1"
