[package]
name = "gale-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gale"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
gale-core = { path = "../gale-core" }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
