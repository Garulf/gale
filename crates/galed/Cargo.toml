[package]
name = "galed"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
gale-core = { path = "../gale-core" }
gale-hw = { path = "../gale-hw" }
gale-hw-corsair = { path = "../gale-hw-corsair" }
gale-hw-nvidia = { path = "../gale-hw-nvidia" }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
mime_guess = "2"
notify = "6"
rand = "0.8"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
gale-hw-hwmon = { path = "../gale-hw-hwmon" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
gale-hw-superio = { path = "../gale-hw-superio" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[build-dependencies]
winresource = "0.1"
